<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Set your password · FC JobDesk</title>
<link rel="stylesheet" href="/static/base.css">
</head>
<body class="solo">
<main class="solo-card">
  <div class="brand">FC JobDesk</div>
  <h1>Choose your password</h1>
  <p class="muted">Your username is your email address. Use at least 10 characters.</p>
  <form id="f">
    <label class="f" for="p1">New password<input id="p1" type="password" autocomplete="new-password" minlength="10" required></label>
    <label class="f" for="p2">Type it again<input id="p2" type="password" autocomplete="new-password" minlength="10" required></label>
    <div id="msg" hidden></div>
    <button class="btn big-btn" type="submit">Save password</button>
  </form>
</main>
<script>
const $=id=>document.getElementById(id), t=new URLSearchParams(location.search).get("t")||"";
function show(cls,text){$("msg").className=cls;$("msg").textContent=text;$("msg").hidden=false}
$("f").onsubmit=async e=>{e.preventDefault();
  if($("p1").value!==$("p2").value) return show("err","The two passwords don't match.");
  const r=await fetch("/api/password/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,password:$("p1").value})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) return show("err",d.error||"Could not save your password.");
  show("ok","Password saved. Taking you to sign in…");
  setTimeout(()=>location.href="/login",1200);
};
</script>
</body>
</html>
