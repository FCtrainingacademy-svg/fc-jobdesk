# Render Blueprint: creates the web app + its Postgres database
services:
  - type: web
    name: fc-jobdesk
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: fc-jobdesk-db, property: connectionString }
      - key: BASE_URL
        sync: false          # e.g. https://fc-jobdesk.onrender.com (or jobs.fctrainingacademy.com later)
      - key: ADMIN_EMAIL
        sync: false          # office login email
      - key: ADMIN_PASSWORD
        sync: false          # first office password - remove after first start
      - key: ADMIN_NAME
        value: FC Office
      - key: OFFICE_EMAIL
        sync: false          # where "job accepted" and "new website lead" emails go
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false          # e.g. FC JobDesk <jobs@fctrainingacademy.com>
      - key: OFFER_HOURS
        value: "4"
      - key: LEAD_FORM_ORIGINS
        value: https://fctrainingacademy.com,https://www.fctrainingacademy.com
databases:
  - name: fc-jobdesk-db
    plan: basic-256mb
    region: frankfurt
